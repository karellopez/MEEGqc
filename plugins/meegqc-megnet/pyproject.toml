[build-system]
requires = ["setuptools>=77"]  # license = "MIT" (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "meegqc-megnet"
version = "0.1.0"
description = "MEGnet plugin for MEEGqc: ECG and EOG references from ICA components of MEG recordings"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [
    {name = "Karel Lopez Vilaret"},
    {name = "ANCP Lab, University of Oldenburg"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # The first MEEGqc with the plugin API (meg_qc.plugins) is the release
    # after 1.1.2: set this to that version when it is published.
    "meg_qc>=1.1.2",
    # 0.3.6: older releases need TensorFlow and do not import with MNE 1.13.
    "megnet-neuro>=0.3.6",
]

[project.urls]
Homepage = "https://github.com/ANCPLabOldenburg/MEEGqc/tree/main/plugins/meegqc-megnet"

[project.entry-points."meegqc.plugins"]
megnet = "meegqc_megnet:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meegqc_megnet = ["settings.ini"]
