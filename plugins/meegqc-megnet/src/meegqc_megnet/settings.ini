[MEGNET]
#ecg (str) - How the ECG metric uses MEGnet's heartbeat component: off; fallback (only when the recorded or reconstructed ECG fails its checks); independent (analysed and reported beside the ECG channel); both. MEGnet runs only on MEG recordings from MEGIN, CTF, 4D and KIT systems that are at least 105 s long. Default: independent
ecg = independent
#eog (str) - How the EOG metric uses MEGnet's eye-movement component: off, fallback, independent or both, as for ecg. Default: independent
eog = independent
#ecg_lowpass_h_freq (float) - Low-pass cutoff applied to MEGnet's heartbeat component before heartbeats are detected. 0 = no low-pass. Unit: Hz. Default: 40
ecg_lowpass_h_freq = 40
#eog_lowpass_h_freq (float) - Low-pass cutoff applied to MEGnet's eye-movement component before blinks are detected. 0 = no low-pass. Unit: Hz. Default: 20
eog_lowpass_h_freq = 20
#probability_threshold (float) - Used when combine_components is True: the ICA components of a class whose MEGnet probability is at least this value are averaged into the reference (at most max_components_per_class). Probabilities are between 0 and 1. The most likely component is always used when none reaches the value. Default: 0.9
probability_threshold = 0.9
#combine_components (bool) - When True, combine multiple ICA components of the same class into a single reference signal, weighted by their probabilities. When False, only the most likely component is used. Default: False
combine_components = False
#max_components_per_class (int) - Maximum number of ICA components to combine per artifact class (only used when combine_components is True). Default: 1
max_components_per_class = 1
#megnet_ecg_class (int) - MEGnet class ID for cardiac (ECG) components. Default: 2
megnet_ecg_class = 2
#megnet_eog_primary_class (int) - MEGnet class ID for primary eye blink (VEOG) components. Default: 1
megnet_eog_primary_class = 1
#megnet_eog_secondary_class (int) - MEGnet class ID for horizontal eye movement (HEOG) components. Default: 3
megnet_eog_secondary_class = 3
