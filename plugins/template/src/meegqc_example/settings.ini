[EXAMPLE]
#ecg (str) - How the ECG metric uses this plugin's reference: off, fallback, independent or both. Default: off
ecg = off
#eog (str) - How the EOG metric uses this plugin's reference: off, fallback, independent or both. Default: off
eog = off
#ecg_lowpass_h_freq (float) - Low-pass applied to the ECG reference before peaks are detected. 0 = none. Unit: Hz. Default: 0
ecg_lowpass_h_freq = 0
#eog_lowpass_h_freq (float) - Low-pass applied to the EOG reference before peaks are detected. 0 = none. Unit: Hz. Default: 0
eog_lowpass_h_freq = 0
#min_seconds (float) - Shortest recording the plugin runs on. Unit: s. Default: 30
min_seconds = 30
